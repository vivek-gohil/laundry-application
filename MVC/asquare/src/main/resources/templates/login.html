<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | A square — Professional ironing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <link rel="stylesheet" th:href="@{/css/branding.css}" />
  <link rel="stylesheet" th:href="@{/css/mobile-menu.css}" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body class="pricing-page">
  <header class="topbar">
    <a class="brand" th:href="@{/}" aria-label="A square home"><span class="brand-icon" aria-hidden="true">A<i class="star star-one">✦</i><i class="star star-two">✦</i></span><span><span class="brand-letter">A</span> <span class="brand-name">square</span></span></a>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation">☰</button>
    <nav class="nav-links" id="primary-navigation">
      <a th:href="@{/#services}">Services</a>
      <a th:href="@{/#how-it-works}">How it works</a>
      <a th:href="@{/pricing}">Pricing</a>
      <a th:href="@{/register}">Register</a>
      <a class="mobile-login" th:href="@{/login}" aria-current="page">Sign in <span>&rarr;</span></a>
    </nav>
    <a class="login" th:href="@{/login}" aria-current="page">Sign in <span>→</span></a>
  </header>

  <main class="login-page">
    <section class="order-section">
      <div class="section-heading">
        <p class="eyebrow"><span></span> MEMBER SIGN IN</p>
        <h2>Login with your<br /><em>mobile number and PIN.</em></h2>
        <p>Enter the mobile number and 4-digit login PIN you created during registration.</p>
      </div>
      <form class="order-card" id="login-form">
        <div class="form-step">
          <span>1</span>
          <div>
            <label for="phone-number">Mobile number</label>
            <input id="phone-number" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="9876543210" required />
          </div>
        </div>
        <div class="form-step">
          <span>2</span>
          <div>
            <label for="login-pin">4-digit login PIN</label>
            <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4"
              autocomplete="current-password" placeholder="••••" required />
          </div>
        </div>
        <button id="login-btn" class="button button-primary" type="submit">Login <span>→</span></button>
      </form>
      <p class="form-message" id="login-message" aria-live="polite"></p>
    </section>
  </main>

  <footer><a class="brand" th:href="@{/}"><span class="brand-icon" aria-hidden="true">A<i class="star star-one">✦</i><i class="star star-two">✦</i></span><span><span class="brand-letter">A</span> <span class="brand-name">square</span></span></a><p>Good clothes. Great care. © 2026 A square.</p><div><a href="#">Instagram</a><a href="#">Help center</a></div></footer>
  <script th:src="@{/js/script.js}"></script>
</body>
</html>
