spring.application.name=laundry-service

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/laundry_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=admin
spring.security.user.password=admin

# JWT configuration
application.security.jwt.secret-key=ReplaceThisWithASecretKeyOfAtLeast32CharactersForHS256Signing
application.security.jwt.expiration=3600000


# WhatsApp Cloud API
application.whatsapp.graph-base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
application.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
application.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
application.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
application.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
application.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
